<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#0f1b2d;--muted:#5b6b82;--line:#d9e2f1;--brand:#1a56db;--brand2:#0b3b8c;--soft:#e8f0ff;--err:#c0261b}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#dfe9fb 0,#eef3fb 220px,#eef3fb 100%);color:var(--ink);line-height:1.55;-webkit-text-size-adjust:100%}
.bar{position:fixed;top:0;left:0;right:0;height:5px;background:#cfdaf0;z-index:5}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#38bdf8);transition:width .3s ease}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--brand2);margin:6px 2px 14px;font-size:.95rem}
.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:16px}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(20,50,110,.10),0 2px 6px rgba(20,50,110,.06);padding:24px 20px 20px;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step{font-size:.82rem;font-weight:700;color:var(--brand);margin:0 0 10px}
h1.q{font-size:1.28rem;line-height:1.45;margin:0 0 6px;font-weight:750;word-break:keep-all;overflow-wrap:anywhere}
.help{color:var(--muted);font-size:.93rem;margin:0 0 14px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;min-height:56px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #9db0d3;display:grid;place-items:center;background:#fff}
.opt.chk .dot{border-radius:6px}
.opt.on{border-color:var(--brand);background:var(--soft)}
.opt.on .dot{border-color:var(--brand);background:var(--brand)}
.opt.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.chk.on .dot::after{width:10px;height:6px;border-radius:0;background:none;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.opt.lang{font-size:1.08rem;font-weight:650;min-height:62px}
.scale{display:grid;gap:8px;margin-top:16px}
.scale.r5{grid-template-columns:repeat(5,1fr)}
.scale.n11{grid-template-columns:repeat(6,1fr)}
.sc{min-height:56px;border:2px solid var(--line);border-radius:14px;background:#fff;font:inherit;font-size:1.15rem;font-weight:700;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.sc.on{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.na{margin-top:10px;justify-content:center;font-size:.95rem;min-height:48px;color:var(--muted)}
textarea{width:100%;min-height:150px;margin-top:14px;padding:14px;border:2px solid var(--line);border-radius:14px;font:inherit;font-size:1rem;resize:vertical;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--brand)}
.err{color:var(--err);font-weight:650;font-size:.92rem;margin-top:12px;min-height:1.2em;white-space:pre-line}
.nav{display:flex;gap:12px;margin-top:18px}
.btn{font:inherit;font-size:1.05rem;font-weight:750;border-radius:14px;min-height:54px;padding:0 20px;cursor:pointer;white-space:nowrap;border:2px solid transparent}
.btn.pri{flex:1;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(26,86,219,.28)}
.btn.pri:disabled{opacity:.6}
.btn.ghost{flex:none;min-width:96px;background:#fff;color:var(--brand2);border-color:var(--line)}
.hero{background:linear-gradient(135deg,#1a56db 0,#0b3b8c 70%);color:#fff;border-radius:22px;padding:26px 22px;margin-bottom:14px;box-shadow:0 10px 30px rgba(20,50,110,.22)}
.hero .em{font-size:2rem;line-height:1}
.hero h1{margin:10px 0 0;font-size:1.35rem;line-height:1.4;font-weight:800;word-break:keep-all}
.hero p{margin:0;opacity:.95;font-size:.95rem;white-space:pre-line}
.intro h3{margin:18px 0 4px;font-size:1rem;font-weight:800;color:var(--brand2)}
.intro h3:first-child{margin-top:0}
.intro p{margin:0 0 6px}
.intro ul{margin:4px 0 0;padding-left:20px}
.intro li{margin:4px 0}
.intro hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.thanks{text-align:center;padding:34px 18px}
.thanks .big{font-size:3rem}
.thanks h1{font-size:1.5rem;margin:8px 0 10px}
.thanks p{color:var(--muted);white-space:pre-line}
.foot{margin-top:auto;padding-top:18px;text-align:center;color:#7a8aa3;font-size:.82rem}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
noscript{display:block;padding:24px;text-align:center}
</style>
</head>

        if (!list) { list = h('ul'); box.appendChild(list); }
        list.appendChild(h('li', { text: t.replace(/^•\s*/, '') })); return;
      }
      list = null;
      if (/^(🎯|🔒|⏱|ℹ)/.test(t)) box.appendChild(h('h3', { text: t })); else box.appendChild(h('p', { text: t }));
    });
    return box;
  }
  function showBlocked() {
    blocked = true; fill.style.width = '0';
    var msg = ['ko', 'en', 'fil'].map(function (x) { return UI[x].err_link; }).join('\n\n');
    screen.replaceChildren(h('div', { class: 'card' }, [h('h1', { class: 'q', text: '⚠️' }), h('p', { class: 'help', text: msg })]));
  }
  function renderWelcome(sec) {
    var u = UI[sec.loc];
    var hero = h('div', { class: 'hero' }, [h('div', { class: 'em', text: '👋' }), h('h1', { text: sec.welcome.title.replace(/^👋\s*/, '') })]);
    var card = h('div', { class: 'card' }, [renderIntro(sec.welcome.help),
      h('div', { class: 'nav' }, [
        h('button', { class: 'btn ghost', type: 'button', text: u.back, onclick: back }),
        h('button', { class: 'btn pri', type: 'button', text: u.start, onclick: function () { stack.push({ si: cur().si, ph: 'q' }); render(); } })])]);
    screen.replaceChildren(hero, card);
  }
  function renderQuestion(sec) {
    var it = sec.item, l = sec.loc, u = l ? UI[l] : null, qid = it.qid;
    var card = h('div', { class: 'card' });
    if (l) card.appendChild(h('p', { class: 'step', text: pathSections().length + ' / ' + totalQ() }));
    card.appendChild(h('h1', { class: 'q', text: it.title }));
    if (it.help) card.appendChild(h('p', { class: 'help', text: it.help }));
    if (!it.required && u) card.appendChild(h('p', { class: 'help', text: u.optional }));
    var errBox = h('div', { class: 'err', role: 'alert' });
    var body = h('div');
    function mark() {
      Array.prototype.forEach.call(body.querySelectorAll('[data-code]'), function (b) {
        var v = answers[qid], c = b.getAttribute('data-code'), on = Array.isArray(v) ? v.indexOf(c) >= 0 : v === c;
        b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    }
    function pick(code) {
      errBox.textContent = '';
      if (it.kind === 'checkbox_max_2') {
        var a = (answers[qid] || []).slice(), i = a.indexOf(code);
        if (i >= 0) a.splice(i, 1);
        else if (code === 'NONE') a = ['NONE'];
        else { a = a.filter(function (x) { return x !== 'NONE'; }); if (a.length >= it.max) { errBox.textContent = u.err_max2; return; } a.push(code); }
        answers[qid] = a;
      } else { answers[qid] = code; }
      mark();
      if (qid === 'Q01') setTimeout(next, 220);
    }
    function optBtn(c, cls) {
      return h('button', { type: 'button', class: cls, role: it.kind === 'checkbox_max_2' ? 'checkbox' : 'radio', 'data-code': c.code, onclick: function () { pick(c.code); } },
        cls.indexOf('sc') === 0 ? [c.label] : [h('span', { class: 'dot' }), h('span', { text: c.label })]);
    }
    if (it.kind === 'paragraph') {
      var ta = h('textarea', { maxlength: '2000', rows: '6', 'aria-label': it.title });
      ta.value = answers[qid] || '';
      ta.addEventListener('input', function () { answers[qid] = ta.value; });
      body.appendChild(ta);
    } else if (it.kind === 'rating_1_5_na') {
      var row = h('div', { class: 'scale r5' }), na = null;
      it.choices.forEach(function (c) { if (c.code === 'NA') na = c; else row.appendChild(optBtn(c, 'sc')); });
      body.appendChild(row); if (na) body.appendChild(optBtn(na, 'opt na'));
    } else if (it.kind === 'nps_0_10') {
      var g = h('div', { class: 'scale n11' }); it.choices.forEach(function (c) { g.appendChild(optBtn(c, 'sc')); }); body.appendChild(g);
    } else {
      var box = h('div', { class: 'opts' });
      it.choices.forEach(function (c) { box.appendChild(optBtn(c, 'opt' + (it.kind === 'checkbox_max_2' ? ' chk' : '') + (qid === 'Q01' ? ' lang' : ''))); });
      body.appendChild(box);
    }
    card.appendChild(body); card.appendChild(errBox);
    if (qid !== 'Q01') {
      var last = sec.after === 'SUBMIT';
      card.appendChild(h('div', { class: 'nav' }, [
        h('button', { class: 'btn ghost', type: 'button', text: u.back, onclick: back }),
        h('button', { class: 'btn pri', type: 'button', id: 'nextbtn', text: last ? u.submit : u.next, onclick: next })]));
    }
    if (it.kind !== 'paragraph') mark();
    if (sec.after === 'SUBMIT') card.appendChild(h('input', { class: 'hp', type: 'text', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true', id: 'hp', name: 'website' }));
    if (!l) screen.replaceChildren(h('div', { class: 'hero' }, [h('p', { text: D.welcomeGlobal })]), card);
    else screen.replaceChildren(card);
  }
  function render() {
    if (blocked) return;
    var e = cur(), sec = S[e.si];
    foot.textContent = loc() ? UI[loc()].footer : '';
    if (e.ph === 'w') renderWelcome(sec); else renderQuestion(sec);
    setBar(); window.scrollTo(0, 0);
  }
  function back() { if (busy || stack.length < 2) return; stack.pop(); render(); }
  function target(sec) {
    var it = sec.item, v = answers[it.qid];
    var ch = it.choices ? it.choices.filter(function (c) { return c.code === v; })[0] : null;
    if (ch && ch.go !== null && ch.go !== undefined) return ch.go;
    return sec.after === 'SUBMIT' ? -1 : idxOf[sec.id] + 1;
  }
  function next() {
    if (busy) return;
    var e = cur(), sec = S[e.si], it = sec.item, v = answers[it.qid];
    var empty = v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
    if (it.required && empty) {
      var eb = screen.querySelector('.err');
      if (eb) eb.textContent = loc() ? UI[loc()].err_required : ['ko', 'en', 'fil'].map(function (x) { return UI[x].err_required; }).join('\n');
      return;
    }
    var t = target(sec);
    if (t === -1) { submit(); return; }
    push(t); render();
  }
  function randomId() {
    var a = new Uint8Array(16); (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function finalAnswers() {
    var out = {};
    pathSections().forEach(function (si) {
      var it = S[si].item, v = answers[it.qid];
      if (v === undefined || v === null) return;
      if (it.kind === 'paragraph') { v = String(v).trim(); if (!v) return; }
      out[it.qid] = v;
    });
    return out;
  }
  function submit() {
    var u = UI[loc()], btn = document.getElementById('nextbtn'), eb = screen.querySelector('.err'), hp = document.getElementById('hp');
    busy = true; if (btn) { btn.disabled = true; btn.textContent = u.sending; } if (eb) eb.textContent = '';
    sendId = sendId || randomId();
    var payload = { v: VESSEL, k: KEY, id: sendId, elapsed: Math.round((Date.now() - t0) / 1000), hp: hp ? hp.value : '', answers: finalAnswers() };
    var ctl = ('AbortController' in window) ? new AbortController() : null, timer = ctl ? setTimeout(function () { ctl.abort(); }, 25000) : null;
    function fail(msg) { busy = false; if (btn) { btn.disabled = false; btn.textContent = u.retry; } if (eb) eb.textContent = msg; }
    fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (timer) clearTimeout(timer);
        if (j && j.ok) return done();
        fail(j && j.error === 'LINK' ? u.err_link : u.err_send);
      })
      .catch(function () { if (timer) clearTimeout(timer); fail(u.err_send); });
  }
  function done() {
    busy = false; fill.style.width = '100%';
    var u = UI[loc()];
    screen.replaceChildren(h('div', { class: 'card thanks' }, [h('div', { class: 'big', text: '✅' }), h('h1', { text: u.thanks_title }), h('p', { text: u.thanks_body })]));
    window.scrollTo(0, 0);
  }
  if (!VESSEL || !KEY || KEY.length < 16 || !ENDPOINT) { showBlocked(); return; }
  push(0); render();
  fetch(ENDPOINT + (ENDPOINT.indexOf('?') >= 0 ? '&' : '?') + 'a=check&v=' + encodeURIComponent(VESSEL) + '&k=' + encodeURIComponent(KEY))
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.ok === false) showBlocked(); })
    .catch(function () {});
})();
</script>
